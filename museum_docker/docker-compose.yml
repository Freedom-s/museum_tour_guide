services:
  # ==================== PostgreSQL 数据库 ====================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: museum-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=museum
      - POSTGRES_USER=museum
      - POSTGRES_PASSWORD=123456
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U museum -d museum"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - museum-network

  # ==================== MinIO 对象存储 ====================
  minio:
    image: quay.io/minio/minio:RELEASE.2025-06-13T11-33-47Z
    container_name: museum-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - museum-network

  # MinIO 初始化服务（创建 bucket）
  minio-init:
    image: minio/mc:latest
    container_name: museum-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb local/artifacts --ignore-existing;
      /usr/bin/mc anonymous set download local/artifacts;
      echo 'MinIO bucket created successfully!';
      exit 0;
      "
    networks:
      - museum-network

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

networks:
  museum-network:
    driver: bridge
